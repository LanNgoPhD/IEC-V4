<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>IEC V4.1 – Thi nói cuối</title>
  <link rel="stylesheet" href="styles.css?v=20261006.4">
  <script src="config.js?v=20261006.1"></script>
  <script src="common.js?v=20261007.11"></script>
</head>
<body>
<script>
(function(){
  if(qp('embed')==='1')return;
  var u=new URL('index.html',location.href);
  new URLSearchParams(location.search).forEach(function(v,k){u.searchParams.set(k,v)});
  u.searchParams.set('view','exam');
  u.searchParams.set('exam','final');
  location.replace(u.toString());
})();
</script>

<div class="wrap">
  <div class="card">
    <h1>THI NÓI CUỐI</h1>
    <div id="finalRule" class="sub">Chỉ kiểm tra các từ VÀNG còn lại.</div>
    <div id="meta" class="statusbar">Đang chuẩn bị...</div>
    <button id="startBtn">BẮT ĐẦU THI NÓI CUỐI</button>
    <div id="topMsg" class="msg"></div>
  </div>

  <div id="testCard" class="card hidden">
    <div id="progress" class="tag"></div>
    <div id="finalPrompt" class="bigword">---</div>
    <div id="timer" class="timer"></div>
    <div id="finalStatus" class="statusbar"></div>
    <div class="info-grid">
      <b>Máy nghe được</b><span id="heard">---</span>
      <b>Nói lại (lệnh AGAIN)</b><span id="again">---</span>
    </div>
  </div>

  <div id="resultCard" class="card hidden">
    <h2>KẾT QUẢ</h2>
    <div id="resultSummary"></div>
  </div>

  <div id="clipBox" class="card hidden">
    <h2>NỘP BÀI THI CUỐI</h2>
    <div id="clipRule" class="sub" style="margin-bottom:10px"><b>BẮT BUỘC:</b> Dán liên kết video của bài thi. Bài thi chỉ hoàn tất sau khi gửi liên kết thành công.</div>
    <input id="clipUrl" type="text" placeholder="Dán liên kết video https://...">
    <div class="row" style="margin-top:10px">
      <button id="clipBtn" disabled>NỘP BÀI THI CUỐI</button>
    </div>
    <div id="submitMsg" class="msg"></div>
  </div>

  <footer class="app-footer">Phát triển bởi TS. Ngô Ngọc Lân</footer>
</div>

<iframe name="submitFrame" class="hidden"></iframe>

<script>
let CTX,DATA,activePost='',clipPending=false;

const finalProgressEl=document.getElementById('progress');
const finalPromptEl=document.getElementById('finalPrompt');
const finalTimerEl=document.getElementById('timer');
const finalStatusEl=document.getElementById('finalStatus');
const finalHeardEl=document.getElementById('heard');
const finalAgainEl=document.getElementById('again');

function vietnameseText_(item){
  const value=item&&(item.vietnamese!=null?item.vietnamese:item.VIETNAMESE);
  return String(value==null?'':value).trim();
}

function inheritClientConfig(){
  try{
    if(window.parent&&window.parent!==window&&window.parent.IEC_V4_RUNTIME_CONFIG){
      IEC_CONFIG=window.parent.IEC_V4_RUNTIME_CONFIG;
      return true;
    }
  }catch(e){}
  return false;
}
async function ensureClientConfig(){
  if(IEC_CONFIG)return IEC_CONFIG;
  if(inheritClientConfig())return IEC_CONFIG;
  try{
    if(window.parent&&window.parent!==window){
      if(typeof window.parent.IEC_V4_ENSURE_CONFIG==='function')await window.parent.IEC_V4_ENSURE_CONFIG();
      else if(window.parent.IEC_V4_CONFIG_PROMISE)await window.parent.IEC_V4_CONFIG_PROMISE;
      if(inheritClientConfig())return IEC_CONFIG;
    }
  }catch(e){}
  return loadClientConfig();
}
function configuredMaxRestart(){
  const v=Number(IEC_CONFIG&&IEC_CONFIG.MAX_RESTART);
  return Number.isFinite(v)?Math.max(0,Math.floor(v)):1;
}
function updateRule(max){
  finalRule.textContent=
    'Chỉ kiểm tra các từ VÀNG còn lại · Tối đa '+(Number.isFinite(Number(max))&&Number(max)>0?Math.floor(Number(max)):'—')+' lần thi mỗi ngày';
}
function showIosSpeakGuide(){
  return new Promise(resolve=>{
    const isChrome=/CriOS/i.test(String(navigator.userAgent||''));
    const old=document.getElementById('iosSpeakGuideOverlay');
    if(old)old.remove();

    const overlay=document.createElement('div');
    overlay.id='iosSpeakGuideOverlay';
    overlay.style.cssText='position:fixed;inset:0;z-index:99999;background:rgba(0,0,0,.58);display:flex;align-items:center;justify-content:center;padding:18px;';

    const box=document.createElement('div');
    box.style.cssText='width:min(440px,100%);background:#fff;border-radius:16px;padding:20px;box-shadow:0 18px 50px rgba(0,0,0,.28);text-align:left;';

    const title=document.createElement('h3');
    title.textContent='THI NÓI TRÊN iPHONE / iPAD';
    title.style.cssText='margin:0 0 12px;font-size:20px;text-align:center;';

    const body=document.createElement('div');
    body.style.cssText='font-size:16px;line-height:1.55;';
    body.innerHTML=
      '<div style="margin-bottom:8px">Để THI NÓI hoạt động ổn định:</div>'+
      '<div>1. Mở bài bằng <b>Google Chrome</b>.</div>'+
      '<div>2. Bật micrô: <b>Cài đặt → Ứng dụng → Chrome → Micrô → Bật</b>.</div>'+
      '<div style="margin-top:8px"><b>Không dùng Safari cho phần THI NÓI.</b></div>';

    if(!isChrome){
      const warn=document.createElement('div');
      warn.style.cssText='margin-top:14px;padding:10px 12px;border-radius:10px;background:#fff4e5;color:#9a3412;font-weight:700;';
      warn.textContent='Trang hiện tại không mở bằng Chrome. Hãy đóng trang này và mở lại liên kết bằng Google Chrome.';
      body.appendChild(warn);
    }

    const btn=document.createElement('button');
    btn.type='button';
    btn.textContent=isChrome?'ĐÃ HIỂU – VÀO THI':'ĐÓNG – MỞ LẠI BẰNG CHROME';
    btn.style.cssText='width:100%;margin-top:18px;padding:13px 14px;font-size:16px;font-weight:800;border:0;border-radius:10px;cursor:pointer;';
    btn.onclick=()=>{overlay.remove();resolve(isChrome);};

    box.appendChild(title);box.appendChild(body);box.appendChild(btn);
    overlay.appendChild(box);document.body.appendChild(overlay);
  });
}
async function ensureIosSpeakReady(){
  if(typeof ttsIsIOS!=='function'||!ttsIsIOS())return true;

  const mayContinue=await showIosSpeakGuide();
  if(!mayContinue){
    setMsg(topMsg,'Trên iPhone/iPad, hãy mở bài bằng Google Chrome trước khi THI NÓI.','err');
    return false;
  }

  if(navigator.mediaDevices&&typeof navigator.mediaDevices.getUserMedia==='function'){
    try{
      const stream=await navigator.mediaDevices.getUserMedia({audio:true});
      stream.getTracks().forEach(t=>t.stop());
    }catch(e){
      setMsg(topMsg,'Chưa có quyền micrô cho Chrome. Vào Cài đặt → Ứng dụng → Chrome → Micrô → Bật, rồi thử lại.','err');
      return false;
    }
  }
  return true;
}
async function startFinal(){
  startBtn.disabled=true;
  resultCard.classList.add('hidden');
  setMsg(topMsg,'Đang tải danh sách VÀNG...');

  try{
    const cfgPromise=ensureClientConfig();
    DATA=await jsonp(
      API_BASE+'?api=final-data&class='+encodeURIComponent(CTX.classId)+
      '&student='+encodeURIComponent(CTX.studentId)+
      '&run='+encodeURIComponent(CTX.runId)+
      '&token='+encodeURIComponent(CTX.token)
    );
    if(!DATA||DATA.ok===false)throw new Error(DATA&&DATA.error||'Không tải được bài thi nói cuối');
    await cfgPromise;

    const used=Number(DATA.attempts&&DATA.attempts.used||0);
    const max=Number(DATA.attempts&&DATA.attempts.max||0);
    updateRule(max);

    if(DATA.submitted){
      meta.textContent='NGÀY '+DATA.run.programDay+' · Đã dùng '+used+'/'+max+' lần thi';
      startBtn.classList.add('hidden');
      topMsg.textContent='';
      showSubmitted(DATA);
      return;
    }

    if(DATA.empty){
      meta.textContent='NGÀY '+DATA.run.programDay+' · Không còn VÀNG';
      startBtn.classList.add('hidden');
      setMsg(topMsg,DATA.message||'Không có từ VÀNG cần thi.','ok');
      return;
    }

    // Một phiên FINAL đang hoạt động luôn cần clip mới khi thực sự kết thúc.
    // Không để localStorage của FINAL cũ khóa nhầm lượt đang thi/reopened.
    resetClipForActiveFinal();

    if(!(await ensureIosSpeakReady())){
      startBtn.disabled=false;
      return;
    }

    meta.textContent=
      'NGÀY '+DATA.run.programDay+
      ' · '+DATA.totalCount+' từ VÀNG'+
      ' · Lần thi '+Number(DATA.attemptNo||used+1)+'/'+max;

    topMsg.textContent='';
    startBtn.classList.add('hidden');
    testCard.classList.remove('hidden');

    const results=await runOfficialSpeechTest(
      DATA.words,DATA.profile,DATA.contextPhrases,
      {
        beforeWord:(w,i,n)=>{
          finalProgressEl.textContent=(i+1)+' / '+n;
          finalPromptEl.textContent=vietnameseText_(w);
          finalHeardEl.textContent='---';
          finalStatusEl.textContent='CHUẨN BỊ';
          finalTimerEl.textContent='';
          finalTimerEl.style.color='';
          finalAgainEl.textContent='Có thể nói '+String(IEC_CONFIG.RESTART_WORD||'AGAIN')+
            ' tối đa '+configuredMaxRestart()+' lần trong cửa phản xạ';
        },
        status:(st,h,info)=>{
          finalStatusEl.textContent=st;
          finalHeardEl.textContent=h||'---';
          finalAgainEl.textContent='AGAIN '+Number(info.restartCount||0)+' / '+configuredMaxRestart();
        },
        timer:(t)=>{
          const sec=Math.max(0,Number(t&&t.remainingSec)||0);
          finalTimerEl.textContent='⏱ '+String(t&&t.label||'THỜI GIAN')+' · '+sec.toFixed(1)+' s';
          finalTimerEl.style.color=(t&&t.urgent)?'#b42318':'';
        },
        afterWord:()=>{
          finalStatusEl.textContent='ĐÃ GHI NHẬN · hệ thống sẽ chấm sau khi kết thúc bài';
          finalTimerEl.textContent='✓ ĐÃ CHỐT';
          finalTimerEl.style.color='';
        }
      }
    );

    // UX/PERFORMANCE: hiện ô KẾT QUẢ ngay khi phần nói kết thúc.
    // Số liệu chính thức vẫn chỉ lấy từ backend sau khi lưu thành công.
    testCard.classList.add('hidden');
    resultCard.classList.remove('hidden');
    resultSummary.className='msg';
    resultSummary.textContent='Đang lưu và cập nhật kết quả...';
    activePost='FINAL';
    setMsg(topMsg,'Đang lưu và cập nhật kết quả...');
    postPayload({
      api:'final-submit',
      classId:CTX.classId,studentId:CTX.studentId,runId:CTX.runId,token:CTX.token,
      sessionId:DATA.sessionId,results:results
    });
  }catch(e){
    startBtn.disabled=false;
    setMsg(topMsg,'LỖI: '+String(e.message||e),'err');
  }
}
function resultHtml(d){
  return '<div class="status-kpis" style="grid-template-columns:repeat(3,minmax(0,1fr));margin-top:12px">'+
    '<div class="status-kpi blue"><span>XANH BIỂN — Đã hoàn thành</span><b>'+Number(d.blue||0)+'</b></div>'+
    '<div class="status-kpi green"><span>XANH LÁ — Chờ trợ giảng xét duyệt</span><b>'+Number(d.green||0)+'</b></div>'+
    '<div class="status-kpi yellow"><span>VÀNG — Chưa đạt thi nói</span><b>'+Number(d.yellow||0)+'</b></div>'+
  '</div>';
}
function showSubmitted(d){
  resultCard.classList.remove('hidden');
  resultSummary.className='';
  resultSummary.innerHTML=resultHtml(d);

  if(d.clipRequired){
    clipBox.classList.remove('hidden');
    const deadline=String(d.finalSubmitDeadline||(d.run&&d.run.finalSubmitDeadline)||(d.run&&d.run.clipDeadline)||'23:59');
    clipRule.innerHTML='<b>BẮT BUỘC:</b> Dán liên kết video và bấm <b>NỘP BÀI THI CUỐI</b> trước '+deadline+':59. Bài thi chưa hoàn tất nếu chưa gửi link.';
    if(d.clipSaved)applyClipLocked(d.clipUrl||'');
    else if(d.finalSubmitOpen===false){clipBtn.disabled=true;clipUrl.readOnly=true;setMsg(submitMsg,'ĐÃ QUÁ HẠN NỘP BÀI THI CUỐI.','err');}
    else clipBtn.disabled=false;
  }
}
function clipKey(){
  return 'IEC_V4_CLIP::'+CTX.classId+'::'+CTX.studentId+'::'+CTX.runId;
}
function applyClipLocked(url){
  clipBtn.dataset.locked='1';
  clipBtn.disabled=true;
  clipUrl.readOnly=true;
  if(url&&!clipUrl.value)clipUrl.value=url;
  clipBtn.textContent='ĐÃ NỘP BÀI THI CUỐI ✓';
  setMsg(submitMsg,'ĐÃ NỘP BÀI THI CUỐI KÈM LIÊN KẾT VIDEO.','ok');
}
function restoreClipState(){
  try{
    const u=localStorage.getItem(clipKey());
    if(u)applyClipLocked(u);
  }catch(e){}
}
function resetClipForActiveFinal(){
  try{localStorage.removeItem(clipKey());}catch(e){}
  clipPending=false;
  clipBox.classList.add('hidden');
  clipBtn.dataset.locked='';
  clipBtn.disabled=true;
  clipBtn.textContent='NỘP BÀI THI CUỐI';
  clipUrl.readOnly=false;
  clipUrl.value='';
  submitMsg.textContent='';
}
function submitClip(){
  const u=String(clipUrl.value||'').trim();
  if(clipBtn.dataset.locked==='1'||clipPending)return;
  if(!/^https?:\/\//i.test(u)){
    alert('BẮT BUỘC dán liên kết video hợp lệ bắt đầu bằng http/https trước khi nộp bài thi cuối.');
    return;
  }

  clipPending=true;
  activePost='CLIP';
  clipBtn.disabled=true;
  clipUrl.readOnly=true;
  clipBtn.textContent='ĐANG NỘP BÀI...';
  setMsg(submitMsg,'Đang nộp bài thi cuối kèm liên kết video...');

  postPayload({
    api:'clip-submit',
    classId:CTX.classId,studentId:CTX.studentId,runId:CTX.runId,token:CTX.token,
    clipUrl:u
  });
}
function handleBackend(e){
  const d=e.data;
  if(!d||typeof d!=='object'||d.ok===undefined)return;

  if(!d.ok){
    if(activePost==='CLIP'){
      clipPending=false;
      clipBtn.disabled=false;
      clipUrl.readOnly=false;
      clipBtn.textContent='NỘP BÀI THI CUỐI';
      setMsg(submitMsg,'LỖI HỆ THỐNG: '+String(d.error||'Không xác định'),'err');
    }else if(activePost==='FINAL'){
      setMsg(topMsg,'LỖI HỆ THỐNG: '+String(d.error||'Không xác định'),'err');
      resultCard.classList.remove('hidden');
      resultSummary.className='msg err';
      resultSummary.textContent='Không lưu được kết quả. Lượt thi chưa được xác nhận.';
    }
    return;
  }

  if(d.clipSaved){
    clipPending=false;
    try{localStorage.setItem(clipKey(),d.clipUrl||clipUrl.value);}catch(e){}
    applyClipLocked(d.clipUrl||'');
    return;
  }

  if(activePost==='FINAL'){
    topMsg.textContent='';
    resultCard.classList.remove('hidden');
    resultSummary.className='';
    resultSummary.innerHTML=resultHtml(d);

    const used=Number(d.attempts&&d.attempts.used||0);
    const max=Number(d.attempts&&d.attempts.max||0);
    const remaining=Number(d.attempts&&d.attempts.remaining||0);
    const yellow=Number(d.yellow||0);

    if(!d.finalStageDone&&yellow>0&&remaining>0){
      meta.textContent=
        'NGÀY '+DATA.run.programDay+
        ' · Đã dùng '+used+'/'+max+' lần thi'+
        ' · Còn '+yellow+' từ VÀNG';

      setMsg(
        topMsg,
        'Đã lưu lần thi '+used+'/'+max+
        ' · Còn '+yellow+' từ VÀNG. Bạn có thể thi lần tiếp theo.',
        'ok'
      );

      startBtn.textContent='THI LẦN TIẾP THEO';
      startBtn.classList.remove('hidden');
      startBtn.disabled=false;
      testCard.classList.add('hidden');
      clipBox.classList.add('hidden');

      DATA=null;
      activePost='';
      return;
    }

    meta.textContent=
      'NGÀY '+DATA.run.programDay+
      ' · Đã dùng '+used+'/'+max+' lần thi · ĐÃ KẾT THÚC';

    const deadline=String(d.finalSubmitDeadline||(DATA.run&&DATA.run.finalSubmitDeadline)||(DATA.run&&DATA.run.clipDeadline)||'23:59');
    setMsg(topMsg,d.clipRequired?'Đã hoàn thành phần thi nói. BẮT BUỘC gửi link video và bấm NỘP BÀI THI CUỐI trước '+deadline+':59.':'Bài thi nói cuối đã hoàn thành.','ok');
    startBtn.classList.add('hidden');
    testCard.classList.add('hidden');

    if(d.clipRequired){
      clipBox.classList.remove('hidden');
      clipRule.innerHTML='<b>BẮT BUỘC:</b> Dán liên kết video và bấm <b>NỘP BÀI THI CUỐI</b> trước '+deadline+':59. Bài thi chưa hoàn tất nếu chưa gửi link.';
      if(d.finalSubmitOpen===false){clipBtn.disabled=true;clipUrl.readOnly=true;setMsg(submitMsg,'ĐÃ QUÁ HẠN NỘP BÀI THI CUỐI.','err');}
      else clipBtn.disabled=false;
    }

    activePost='';
  }
}

document.addEventListener('DOMContentLoaded',async function(){
  window.addEventListener('message',handleBackend);
  startBtn.onclick=startFinal;
  clipBtn.onclick=submitClip;

  try{
    CTX=requireContext();
    meta.textContent='Sẵn sàng';
    restoreClipState();
    ensureClientConfig().then(function(){
      const max=Number(IEC_CONFIG&&IEC_CONFIG.FINAL_LAST_MAX_ATTEMPTS);
      updateRule(max);
      meta.textContent='Sẵn sàng · tối đa '+(Number.isFinite(max)&&max>0?Math.floor(max):'—')+' lần thi/ngày';
    }).catch(function(e){
      setMsg(topMsg,String(e.message||e),'err');
      startBtn.disabled=true;
    });
  }catch(e){
    setMsg(topMsg,String(e.message||e),'err');
    startBtn.disabled=true;
  }
});
</script>
</body>
</html>
