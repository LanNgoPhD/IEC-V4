<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>IEC V4 – Trợ giảng xem xét</title><link rel="stylesheet" href="styles.css?v=20261006.4"><script src="config.js?v=20261006.1"></script><script src="common.js?v=20261005.2"></script></head><body><script>(function(){if(qp('embed')==='1')return;var u=new URL('index.html',location.href);new URLSearchParams(location.search).forEach(function(v,k){u.searchParams.set(k,v)});u.searchParams.set('role','ta');u.searchParams.set('view','manage');location.replace(u.toString());})();</script><div class="wrap">
<div class="card"><h1>TRỢ GIẢNG – XEM XÉT XANH LÁ</h1><div class="sub">XANH LÁ được trợ giảng xác nhận: ĐẠT → XANH BIỂN; CHƯA ĐẠT → VÀNG. Không chuyển ĐỎ vì đánh giá phát âm.</div><div id="meta" class="statusbar"></div><button id="reload" class="secondary">TẢI LẠI DANH SÁCH</button></div>
<div id="work" class="card hidden"><div class="tag" id="progress"></div><h2 id="word"></h2><div class="muted" id="student"></div><video id="video" controls playsinline style="width:100%;max-height:420px;margin-top:12px"></video><div style="margin-top:12px"><label>Nhận xét TA</label><textarea id="comment" rows="3" placeholder="Nhận xét ngắn cho sinh viên"></textarea><div class="row" style="margin-top:10px"><button id="blue" class="good">XANH BIỂN – ĐẠT</button><button id="yellow" class="yellow">VÀNG – CHƯA ĐẠT, LUYỆN LẠI</button></div></div><div id="msg" class="msg"></div></div>
<div id="empty" class="card hidden"><h2>Không có XANH LÁ chờ xem xét</h2><div class="msg ok">Hàng chờ hiện đang trống.</div></div>
<footer class="app-footer">Phát triển bởi TS. Ngô Ngọc Lân</footer></div><iframe name="submitFrame" class="hidden"></iframe><script>
const CLASS=qp('class'),TOKEN=qp('token');let QUEUE=[],POS=0;
const meta=document.getElementById('meta'),work=document.getElementById('work'),empty=document.getElementById('empty'),reload=document.getElementById('reload'),blue=document.getElementById('blue'),yellow=document.getElementById('yellow'),comment=document.getElementById('comment'),msg=document.getElementById('msg');
document.addEventListener('DOMContentLoaded',async()=>{window.addEventListener('message',handleMessage);reload.onclick=loadQueue;blue.onclick=()=>submitDecision('BLUE');yellow.onclick=()=>submitDecision('YELLOW');try{if(!CLASS||!TOKEN)throw new Error('Liên kết trợ giảng không đầy đủ');await loadQueue()}catch(e){meta.textContent=String(e.message||e)}});
async function loadQueue(){setMsg(msg,'');const d=await jsonp(API_BASE+'?api=ta-queue&class='+encodeURIComponent(CLASS)+'&token='+encodeURIComponent(TOKEN));if(!d||d.ok===false)throw new Error(d&&d.error||'Không tải được hàng chờ XANH LÁ');QUEUE=d.items||[];POS=0;meta.textContent=CLASS+' · '+String(d.reviewer||'Trợ giảng')+' · XANH LÁ chờ xem xét: '+QUEUE.length;render()}
function render(){comment.value='';blue.disabled=false;yellow.disabled=false;setMsg(msg,'');if(POS>=QUEUE.length){work.classList.add('hidden');empty.classList.remove('hidden');return}empty.classList.add('hidden');work.classList.remove('hidden');const x=QUEUE[POS];progress.textContent=(POS+1)+' / '+QUEUE.length;word.textContent=x.english||x.contentId||'';student.textContent='Sinh viên: '+String(x.studentId||'')+' · Ngày '+String(x.programDay||'');video.src=x.clipUrl||''}
function submitDecision(decision){const x=QUEUE[POS],com=comment.value.trim();blue.disabled=true;yellow.disabled=true;setMsg(msg,'Đang lưu...');postPayload({api:'ta-review-submit',classId:CLASS,token:TOKEN,reviewId:x.reviewId,decision:decision,errorTag:'',comment:com})}
function handleMessage(e){const d=e.data;if(!d||typeof d!=='object'||d.ok===undefined)return;if(!d.ok){blue.disabled=false;yellow.disabled=false;setMsg(msg,'LỖI: '+String(d.error||'Không xác định'),'err');return}const st=String(d.finalStatus||d.decision||'').toUpperCase();setMsg(msg,'ĐÃ LƯU: '+(st==='BLUE'?'XANH BIỂN – ĐẠT':'VÀNG – LUYỆN LẠI'),'ok');POS++;setTimeout(render,650)}
</script></body></html>
