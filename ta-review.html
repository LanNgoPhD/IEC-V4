<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>IEC V4 – Trợ giảng xem xét</title><link rel="stylesheet" href="styles.css?v=4.0.1"><script src="config.js?v=4.0.1"></script><script src="common.js?v=4.0.1"></script></head><body><div class="wrap">
<div class="card"><h1>TRỢ GIẢNG – XEM XÉT XANH LÁ</h1><div class="sub">Chỉ xuất hiện khi chế độ XANH LÁ được bật và số trường hợp nghi ngờ đạt ngưỡng cấu hình.</div><div id="meta" class="statusbar"></div><button id="reload" class="secondary">TẢI LẠI DANH SÁCH</button></div>
<div id="work" class="card hidden"><div class="tag" id="progress"></div><h2 id="word"></h2><div class="muted" id="student"></div><video id="video" controls playsinline style="width:100%;max-height:420px;margin-top:12px"></video><div class="row" style="margin-top:12px"><button id="yellow">VÀNG – TIẾP TỤC LUYỆN NÓI</button><button id="red" class="danger">ĐỎ – CHƯA ĐẠT</button></div><div id="redFields" class="hidden" style="margin-top:12px"><label>Lỗi chính</label><select id="error"><option value="">-- Chọn lỗi --</option></select><label style="margin-top:8px">Nhận xét (không bắt buộc)</label><textarea id="comment" rows="3" placeholder="Nhận xét ngắn cho sinh viên"></textarea><button id="saveRed" class="danger" style="margin-top:10px">LƯU KẾT QUẢ ĐỎ</button></div><div id="msg" class="msg"></div></div>
<div id="empty" class="card hidden"><h2>Không có XANH LÁ chờ xem xét</h2><div class="msg ok">Hàng chờ hiện đang trống.</div></div>
</div><iframe name="submitFrame" class="hidden"></iframe><script>
const CLASS=qp('class'),TOKEN=qp('token');let QUEUE=[],POS=0;const meta=document.getElementById('meta'),work=document.getElementById('work'),empty=document.getElementById('empty'),reload=document.getElementById('reload'),yellow=document.getElementById('yellow'),red=document.getElementById('red'),saveRed=document.getElementById('saveRed'),redFields=document.getElementById('redFields'),error=document.getElementById('error'),comment=document.getElementById('comment'),msg=document.getElementById('msg');
document.addEventListener('DOMContentLoaded',async()=>{window.addEventListener('message',handleMessage);reload.onclick=loadQueue;yellow.onclick=()=>submitDecision('YELLOW');red.onclick=showRedForm;saveRed.onclick=()=>submitDecision('RED');try{await loadClientConfig();if(!CLASS||!TOKEN)throw new Error('Liên kết trợ giảng không đầy đủ');await loadQueue()}catch(e){meta.textContent=String(e.message||e)}});
async function loadQueue(){setMsg(msg,'');const d=await jsonp(API_BASE+'?api=ta-queue&class='+encodeURIComponent(CLASS)+'&token='+encodeURIComponent(TOKEN));if(!d||d.ok===false)throw new Error(d&&d.error||'Không tải được hàng chờ XANH LÁ');QUEUE=d.items||[];POS=0;error.innerHTML='<option value="">-- Chọn lỗi --</option>';(d.errorTags||[]).forEach(v=>{const o=document.createElement('option');o.value=String(v);o.textContent=String(v);error.appendChild(o)});meta.textContent=CLASS+' · '+String(d.reviewer||'Trợ giảng')+' · XANH LÁ chờ xem xét: '+QUEUE.length;render()}
function render(){redFields.classList.add('hidden');error.value='';comment.value='';yellow.disabled=false;red.disabled=false;saveRed.disabled=false;setMsg(msg,'');if(POS>=QUEUE.length){work.classList.add('hidden');empty.classList.remove('hidden');return}empty.classList.add('hidden');work.classList.remove('hidden');const x=QUEUE[POS];progress.textContent=(POS+1)+' / '+QUEUE.length;word.textContent=x.english||x.contentId||'';student.textContent='Sinh viên: '+String(x.studentId||'')+' · Ngày '+String(x.programDay||'');video.src=x.clipUrl||''}
function showRedForm(){redFields.classList.remove('hidden');setMsg(msg,'Chọn lỗi chính rồi bấm “LƯU KẾT QUẢ ĐỎ”.')}
function submitDecision(decision){const x=QUEUE[POS],err=error.value,com=comment.value.trim();if(decision==='RED'&&!err){setMsg(msg,'Hãy chọn lỗi trước khi lưu kết quả ĐỎ.','err');return}yellow.disabled=true;red.disabled=true;saveRed.disabled=true;setMsg(msg,'Đang lưu...');postPayload({api:'ta-review-submit',classId:CLASS,token:TOKEN,reviewId:x.reviewId,decision:decision,errorTag:err,comment:com})}
function handleMessage(e){const d=e.data;if(!d||typeof d!=='object'||d.ok===undefined)return;if(!d.ok){yellow.disabled=false;red.disabled=false;saveRed.disabled=false;setMsg(msg,'LỖI: '+String(d.error||'Không xác định'),'err');return}setMsg(msg,'ĐÃ LƯU: '+(String(d.finalStatus||d.decision||'').toUpperCase()==='YELLOW'?'VÀNG':'ĐỎ'),'ok');POS++;setTimeout(render,650)}
</script></body></html>
