<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <link rel="preconnect" href="https://script.google.com">
  <link rel="preconnect" href="https://script.googleusercontent.com">
  <title>IEC V4.1</title>
  <link rel="stylesheet" href="styles.css?v=20261006.3">
  <script src="config.js?v=20261006.1"></script>
  <script src="common.js?v=20261005.2"></script>
</head>
<body>
<div class="portal-shell">
  <header class="portal-header">
    <div>
      <h1>IEC V4.1</h1>
      <div id="portalMeta" class="sub">Đang kết nối...</div>
    </div>
    <div class="stateLegend">
      <span class="stateRed">ĐỎ – Chưa đạt thi viết</span>
      <span class="stateYellow">VÀNG – Chưa đạt thi nói</span>
      <span class="stateBlue">XANH BIỂN – Đã hoàn thành</span>
      <span class="stateGreen">XANH LÁ – Chờ trợ giảng xét duyệt</span>
    </div>
  </header>

  <nav id="nav" class="portal-tabs"></nav>

  <main>
    <section id="infoView" class="portal-view">
      <div class="card">
        <h2>THÔNG TIN</h2>
        <div id="infoBody" class="msg">Đang tải thông tin...</div>
      </div>
    </section>

    <section id="examView" class="portal-view hidden">
      <div class="card">
        <h2>CA THI</h2>
        <div id="examAttempts" class="sub">Đang tải giới hạn số lần thi...</div>
        <div class="exam-grid">
          <button onclick="showFrame('morning.html','exam')">
            <b>CA SÁNG</b>
            <span>Thi viết TỪ MỚI + ĐỎ CŨ</span>
          </button>
          <button onclick="showFrame('drill.html?examOnly=1','exam')">
            <b>CA GIỮA NGÀY</b>
            <span>Cải thiện ĐỎ thành VÀNG bằng bài thi viết và VÀNG thành XANH BIỂN bằng bài thi nói</span>
          </button>
          <button onclick="showFrame('final.html','exam')">
            <b>CA CUỐI NGÀY</b>
            <span>Thi nói các từ VÀNG còn lại</span>
          </button>
        </div>
      </div>
    </section>

    <section id="frameView" class="portal-view hidden">
      <iframe id="portalFrame" class="portal-frame" title="IEC"></iframe>
    </section>

    <section id="resultView" class="portal-view hidden">
      <div class="card">
        <h2>KẾT QUẢ</h2>
        <div id="resultBody" class="msg">Đang tải...</div>
      </div>
    </section>
  </main>

  <footer class="app-footer">Phát triển bởi TS. Ngô Ngọc Lân</footer>
</div>

<script>
const ROLE=(qp('role')||'student').toLowerCase();
const VIEW=(qp('view')||'info').toLowerCase();
const UI_BUILD='20261006.3';
let CTX=null,STUDENT_INFO=null;
window.IEC_V4_RUNTIME_CONFIG=null;
window.IEC_V4_CONFIG_PROMISE=null;
window.IEC_V4_ENSURE_CONFIG=function(){
  if(window.IEC_V4_RUNTIME_CONFIG)return Promise.resolve(window.IEC_V4_RUNTIME_CONFIG);
  if(window.IEC_V4_CONFIG_PROMISE)return window.IEC_V4_CONFIG_PROMISE;
  window.IEC_V4_CONFIG_PROMISE=loadClientConfig().then(function(cfg){
    window.IEC_V4_RUNTIME_CONFIG=cfg;
    updateExamAttempts();
    return cfg;
  }).catch(function(err){
    window.IEC_V4_CONFIG_PROMISE=null;
    throw err;
  });
  return window.IEC_V4_CONFIG_PROMISE;
};

function copyParams(url){
  const u=new URL(url,location.href);
  new URLSearchParams(location.search).forEach(function(v,k){
    if(!['view','exam','role','embed'].includes(k))u.searchParams.set(k,v);
  });
  u.searchParams.set('embed','1');
  return u.toString();
}
function addTab(id,label,fn){
  const b=document.createElement('button');
  b.textContent=label;b.dataset.id=id;b.onclick=fn;nav.appendChild(b);return b;
}
function showView(id){
  document.querySelectorAll('.portal-view').forEach(x=>x.classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
  document.querySelectorAll('#nav button').forEach(
    x=>x.classList.toggle('active',x.dataset.id===id.replace('View',''))
  );
}
function showFrame(page,tab){
  showView('frameView');
  document.querySelectorAll('#nav button').forEach(
    x=>x.classList.toggle('active',x.dataset.id===tab)
  );
  const u=new URL(copyParams(page));
  u.searchParams.set('_v',UI_BUILD);
  const next=u.toString();
  if(portalFrame.dataset.src!==next){
    portalFrame.dataset.src=next;
    portalFrame.src=next;
  }
}
function esc(x){
  return String(x==null?'':x).replace(/[&<>"]/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
  });
}
function uiState(s){
  const k=String(s||'').toUpperCase();
  const m={
    RED:'ĐỎ',YELLOW:'VÀNG',BLUE:'XANH BIỂN',GREEN:'XANH LÁ',
    DONE:'ĐÃ XONG',PENDING:'CHỜ',COMPLETED:'ĐÃ HOÀN THÀNH',
    RETRY:'CÒN ĐỎ – CÓ THỂ THI LẠI',MAX_ATTEMPTS:'ĐÃ HẾT LẦN THI SÁNG',
    AWAIT_CLIP:'CHỜ VIDEO',CLIP_MISSING:'THIẾU VIDEO',MISSED:'BỎ LỠ',
    STARTED:'ĐANG LÀM',NOT_STARTED:'CHƯA BẮT ĐẦU','N/A':'—'
  };
  return m[k]||viState(s);
}
function configCount(key){
  const v=Number(IEC_CONFIG&&IEC_CONFIG[key]);
  return Number.isFinite(v)&&v>=0?Math.floor(v):'—';
}
function updateExamAttempts(){
  if(!IEC_CONFIG)return;
  examAttempts.textContent=
    'CA SÁNG: '+configCount('MORNING_MAX_ATTEMPTS')+' lần thi · '+
    'CA GIỮA NGÀY: '+configCount('DRILL_SPEAK_TEST_MAX_PER_DAY')+' lần thi · '+
    'CA CUỐI NGÀY: '+configCount('FINAL_LAST_MAX_ATTEMPTS')+' lần thi';
}
async function loadStudentInfo(force){
  if(STUDENT_INFO&&!force){renderStudentInfo(STUDENT_INFO);return STUDENT_INFO;}
  infoBody.className='msg';infoBody.textContent='Đang tải thông tin...';
  const d=await jsonp(
    API_BASE+'?api=student-info&class='+encodeURIComponent(CTX.classId)+
    '&student='+encodeURIComponent(CTX.studentId)+
    '&run='+encodeURIComponent(CTX.runId)+
    '&token='+encodeURIComponent(CTX.token)
  );
  if(!d||d.ok===false)throw new Error(d&&d.error||'Không tải được thông tin');
  STUDENT_INFO=d;renderStudentInfo(d);return d;
}
function renderStudentInfo(d){
  portalMeta.textContent=(d.student.fullName||d.student.studentId)+' · Ngày '+d.run.programDay+' · IEC '+d.version;
  infoBody.className='';
  infoBody.innerHTML=
    '<div class="kpis">'+
      '<div class="kpi"><span>ĐỎ – Chưa đạt thi viết</span><b>'+d.counts.RED+'</b></div>'+
      '<div class="kpi yellowKpi"><span>VÀNG – Chưa đạt thi nói</span><b>'+d.counts.YELLOW+'</b></div>'+
      '<div class="kpi"><span>XANH LÁ – Chờ trợ giảng xét duyệt</span><b>'+d.counts.GREEN+'</b></div>'+
      '<div class="kpi"><span>XANH BIỂN – Hoàn thành</span><b>'+d.counts.BLUE+'</b></div>'+
    '</div>'+
    '<div class="info-grid portal-info">'+
      '<b>CA SÁNG</b><span>'+esc(uiState(d.morning.status))+
        ' · đã dùng '+d.morning.used+'/'+d.morning.maxAttempts+' lần thi</span>'+
      '<b>CA GIỮA NGÀY</b><span>Đã dùng '+d.drillSpeak.used+'/'+d.drillSpeak.max+' lần thi</span>'+
      '<b>CA CUỐI NGÀY</b><span>'+esc(uiState(d.final.status))+
        ' · đã dùng '+d.final.used+'/'+d.final.maxAttempts+' lần thi</span>'+
      '<b>Trợ giảng đang xem xét</b><span>'+d.reviewWaiting+' nội dung XANH LÁ</span>'+
    '</div>';
}
async function loadResults(){
  showView('resultView');
  resultBody.className='msg';resultBody.textContent='Đang tải...';
  const d=await jsonp(
    API_BASE+'?api=student-results&class='+encodeURIComponent(CTX.classId)+
    '&student='+encodeURIComponent(CTX.studentId)+
    '&token='+encodeURIComponent(CTX.token)
  );
  if(!d||d.ok===false)throw new Error(d&&d.error||'Không tải được kết quả');

  let h='<h3>Lịch sử ngày học</h3><div class="table-scroll"><table><thead><tr>'+
    '<th>Ngày</th><th>Sáng</th><th>Giữa ngày</th><th>Cuối ngày</th>'+
    '<th>ĐỎ</th><th>VÀNG</th><th>XANH LÁ</th><th>XANH BIỂN</th>'+
    '</tr></thead><tbody>';
  (d.days||[]).forEach(function(x){
    h+='<tr><td>'+x.programDay+'</td><td>'+esc(uiState(x.morningStatus))+'</td>'+
      '<td>'+esc(uiState(x.drillStatus))+'</td><td>'+esc(uiState(x.finalStatus))+'</td>'+
      '<td>'+x.red+'</td><td>'+x.yellow+'</td><td>'+x.green+'</td><td>'+x.blue+'</td></tr>';
  });
  h+='</tbody></table></div><h3>Trợ giảng xem xét XANH LÁ</h3>';

  if(!(d.reviews||[]).length){
    h+='<div class="msg">Chưa có trường hợp XANH LÁ.</div>';
  }else{
    h+='<div class="table-scroll"><table><thead><tr>'+
      '<th>Ngày</th><th>Từ</th><th>Trạng thái</th><th>Nhận xét TA</th>'+
      '</tr></thead><tbody>';
    d.reviews.forEach(function(x){
      h+='<tr><td>'+x.programDay+'</td><td>'+esc(x.word)+'</td>'+
        '<td>'+esc(x.reviewStatus==='DONE'?uiState(x.result):'CHỜ TA')+'</td>'+
        '<td>'+esc(x.comment||'—')+'</td></tr>';
    });
    h+='</tbody></table></div>';
  }
  resultBody.className='';resultBody.innerHTML=h;
}
function buildStudentNav(){
  CTX=requireContext();
  portalMeta.textContent=CTX.studentId+' · IEC V4.1';
  addTab('info','THÔNG TIN',function(){
    showView('infoView');
    loadStudentInfo().catch(showErr);
  });
  addTab('frame','LUYỆN TẬP',()=>showFrame('drill.html','frame'));
  addTab('exam','CA THI',function(){
    showView('examView');
    document.querySelectorAll('#nav button').forEach(
      x=>x.classList.toggle('active',x.dataset.id==='exam')
    );
    window.IEC_V4_ENSURE_CONFIG().catch(function(e){examAttempts.textContent='LỖI: '+String(e.message||e);});
  });
  addTab('result','KẾT QUẢ',()=>loadResults().catch(showErr));
}
function routeStudent(){
  if(VIEW==='practice')return showFrame('drill.html','frame');
  if(VIEW==='exam'){
    const which=(qp('exam')||'').toLowerCase();
    if(which==='final')return showFrame('final.html','exam');
    if(which==='morning')return showFrame('morning.html','exam');
    if(which==='drill')return showFrame('drill.html?examOnly=1','exam');
    showView('examView');
    document.querySelectorAll('#nav button').forEach(
      x=>x.classList.toggle('active',x.dataset.id==='exam')
    );
    window.IEC_V4_ENSURE_CONFIG().catch(function(e){examAttempts.textContent='LỖI: '+String(e.message||e);});
    return;
  }
  if(VIEW==='result')return loadResults().catch(showErr);
  showView('infoView');
  loadStudentInfo().catch(showErr);
}
function setupTa(){
  portalMeta.textContent='Cổng TRỢ GIẢNG';
  addTab('info','THÔNG TIN',function(){
    showView('infoView');
    infoBody.textContent='XANH LÁ: trợ giảng đánh giá ĐẠT → XANH BIỂN; CHƯA ĐẠT → VÀNG.';
  });
  addTab('manage','QUẢN LÝ',()=>showFrame('ta-review.html','manage'));
  if(VIEW==='manage')showFrame('ta-review.html','manage');
  else document.querySelector('#nav button').click();
}
function setupDashboard(){
  portalMeta.textContent='QUẢN LÝ IEC';
  addTab('manage','QUẢN LÝ',()=>showFrame('dashboard.html','manage'));
  showFrame('dashboard.html','manage');
}
function showErr(e){
  const target=document.getElementById('infoBody');
  if(target){target.className='msg err';target.textContent='LỖI: '+String(e.message||e);}
  portalMeta.textContent='LỖI';
}

document.addEventListener('DOMContentLoaded',function(){
  try{
    if(ROLE==='ta'){
      setupTa();
    }else if(ROLE==='dashboard'||ROLE==='admin'){
      setupDashboard();
    }else{
      buildStudentNav();
    }

    if(ROLE!=='ta'&&ROLE!=='dashboard'&&ROLE!=='admin'){
      // PERFORMANCE: route ngay. client-config chỉ tải khi màn hình thực sự cần nó
      // (LUYỆN TẬP/THI NÓI/CA THI), nên CA SÁNG và THÔNG TIN bớt một request mở trang.
      routeStudent();
    }
  }catch(e){
    showErr(e);
  }
});
</script>
</body>
</html>
